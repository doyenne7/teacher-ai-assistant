        <div class="course-card-body">
          <div class="course-card-name">${m.name}</div>
          <div class="course-card-grade">${m.grade}</div>
          <div class="course-card-desc">${m.desc}</div>
        </div>
      </div>
    `).join("")}
  `;
  overlay.querySelectorAll(".course-card").forEach(card => {
    card.addEventListener("click", () => selectCourse(card.dataset.course));
  });
  overlay.classList.remove("hidden");
}

function selectCourse(courseId) {
  STATE.courseId = courseId;
  localStorage.setItem("teacherAssistantCourse", courseId);
  $("course-overlay").classList.add("hidden");
  renderHeader();
  resetConversation();
}

/* ============================================================
   FLOWS
   ============================================================ */
async function startConversation() {
  // If no course selected yet, show the course picker first
  if (!STATE.courseId) {
    showCourseSelector();
    return;
  }
  STATE.generation += 1;
  $("chat").innerHTML = "";
  clearQuickReplies();
  hideTyping();
  appendDayDivider();
  if (STATE.lastLessonTaught && STATE.pendingNote) {
    const lessonObj = t().lessonChips.find(l => l.id == STATE.lastLessonTaught);
    const greet = t().greetings.returning[0].replace("{lastLesson}", lessonObj ? lessonObj.label : "L" + STATE.lastLessonTaught);
    await botSay(greet, 500);
    if (STATE.pendingNote) {
      await botSay(`<p><span class="label">${t().ui.heyLabel}</span></p><p>${escapeHtml(STATE.pendingNote)}</p>`, 600);
    }
  } else {
    for (const line of t().greetings.first) {
      await botSay(line, 600);
    }
  }
  showHomeMenu();
}

function showHomeMenu() {
  const intents = t().intents;
  setQuickReplies(intents.map(i => ({
    label: i.label,
    action: () => handleIntent(i.id)
  })));
}

async function handleIntent(intentId) {
  STATE.context = { intent: intentId };
  switch (intentId) {
    case "preflight": return flowPreflight();
    case "inmoment": return flowInMoment();
    case "concept": return flowConcept();
    case "misconception": return flowMisconception();
    case "reflect": return flowReflect();
  }
}

/* ---------- PRE-FLIGHT ---------- */
async function flowPreflight() {
  await botSay(`<p>${t().pickLessonPrompt}</p>`, 400);
  setQuickReplies(t().lessonChips.map(l => ({
    label: l.label,
    action: () => showPreflight(l.id)
  })));
}

async function showPreflight(lessonId) {
  STATE.context = { intent: "preflight", lessonId };
  const p = t().preflight[lessonId];
  await botSay(`<p><strong>${p.header}</strong></p>${p.body}`, 900);
  const followUps = p.followUps.map(fu => ({
    label: fu,
    action: () => handlePreflightFollowUp(lessonId, fu)
  }));
  followUps.push({ label: t().ui.backHome, action: returnHome, secondary: true });
  setQuickReplies(followUps);
}

async function handlePreflightFollowUp(lessonId, label) {
  // Map common follow-ups
  if (label.toLowerCase().includes("vocab") || label.includes("शब्दावली")) {
    return showLessonVocab(lessonId);
  }
  if (label.toLowerCase().includes("question") || label.includes("preguntas") || label.includes("प्रश्न") || label.includes("question")) {
    return flowInMomentForLesson(lessonId);
  }
  if (label.toLowerCase().includes("misconception") || label.includes("error") || label.includes("गलतफहमी")) {
    return showMisconceptions(lessonId);
  }
  // Generic fallback — bot acknowledges
  await botSay(`<p>${t().helpers.noMatch}</p>`, 500);
  showHomeMenu();
}

async function showLessonVocab(lessonId) {
  const relevant = t().concepts.filter(c => c.lessons.includes(Number(lessonId)));
  const lessonLabel = t().lessonChips.find(l => l.id === Number(lessonId)).label;
  const vocabIntros = {
    en: `Vocab in <strong>${lessonLabel}</strong> (${relevant.length} terms). Tap to refresh:`,
    es: `Vocabulario en <strong>${lessonLabel}</strong> (${relevant.length} términos). Toca para repasar:`,
    hi: `<strong>${lessonLabel}</strong> की शब्दावली (${relevant.length} शब्द)। पुनरीक्षण के लिए टैप करें:`
  };
  await botSay(`<p>${vocabIntros[STATE.lang]}</p>`, 400);
  setQuickReplies([
    ...relevant.map(c => ({ label: c.term, action: () => showConceptDetail(c.id) })),
    { label: t().ui.backHome, action: returnHome, secondary: true }
  ]);
}

/* ---------- IN-THE-MOMENT ---------- */
async function flowInMoment() {
  await botSay(`<p>${t().pickLessonPrompt}</p>`, 400);
  setQuickReplies(t().lessonChips.map(l => ({
    label: l.label,
    action: () => flowInMomentForLesson(l.id)
  })));
}

async function flowInMomentForLesson(lessonId) {
  STATE.context = { intent: "inmoment", lessonId };
  const qs = t().studentQs[lessonId];
  const lessonLabel = t().lessonChips.find(l => l.id === Number(lessonId)).label;
  const intros = {
    en: `What did your student ask, or what's happening? Common ones for <strong>${lessonLabel}</strong>:`,
    es: `¿Qué te preguntó el estudiante? Las comunes para <strong>${lessonLabel}</strong>:`,
    hi: `छात्र ने क्या पूछा? <strong>${lessonLabel}</strong> के आम प्रश्न:`
  };
  await botSay(`<p>${intros[STATE.lang]}</p>`, 600);
  setQuickReplies([
    ...qs.map((q, idx) => ({ label: q.q, action: () => showStudentAnswer(lessonId, idx) })),
    { label: t().ui.backHome, action: returnHome, secondary: true }
  ]);
}

async function showStudentAnswer(lessonId, qIdx) {
  const item = t().studentQs[lessonId][qIdx];
  await botSay(item.a, 1100);
  setQuickReplies([
    { label: t().ui.thatHelped, action: returnHome, primary: true },
    { label: t().ui.anotherQuestion, action: () => flowInMomentForLesson(lessonId) },
    { label: t().ui.backHome, action: returnHome, secondary: true }
  ]);
}

/* ---------- CONCEPT REFRESHER ---------- */
async function flowConcept() {
  await botSay(`<p>${STATE.lang === "es" ? "¿Qué concepto?" : STATE.lang === "hi" ? "कौन सी अवधारणा?" : "Which concept?"}</p>`, 400);
  const chips = t().concepts.map(c => ({ label: c.term, action: () => showConceptDetail(c.id) }));
  chips.push({ label: t().ui.backHome, action: returnHome, secondary: true });
  setQuickReplies(chips);
}

async function showConceptDetail(conceptId) {
  const c = t().concepts.find(x => x.id === conceptId);
  if (!c) return;
  const adultLabel = STATE.lang === "es" ? "Para ti" : STATE.lang === "hi" ? "आपके लिए" : "For you";
  const kidLabel = STATE.lang === "es" ? "Para tus estudiantes" : STATE.lang === "hi" ? "अपने छात्रों के लिए" : "For your students";
  const exLabel = STATE.lang === "es" ? "Ejemplo" : STATE.lang === "hi" ? "उदाहरण" : "Example";
  const nonLabel = STATE.lang === "es" ? "No es" : STATE.lang === "hi" ? "उदाहरण नहीं" : "Not an example";
  const html = `
    <p><strong>${c.term}</strong></p>
    <p><span class="label">${adultLabel}</span></p>
    <p>${c.adult}</p>
    <p><span class="label">${kidLabel}</span></p>
    <div class="quote">${c.kid}</div>
    <p><strong>${exLabel}:</strong> ${c.example}<br><strong>${nonLabel}:</strong> ${c.nonexample}</p>`;
  await botSay(html, 900);
  setQuickReplies([
    { label: t().ui.anotherQuestion, action: flowConcept, primary: true },
    { label: t().ui.backHome, action: returnHome, secondary: true }
  ]);
}

/* ---------- MISCONCEPTIONS ---------- */
async function flowMisconception() {
  await botSay(`<p>${t().pickLessonPrompt}</p>`, 400);
  setQuickReplies(t().lessonChips.map(l => ({
    label: l.label,
    action: () => showMisconceptions(l.id)
  })));
}

async function showMisconceptions(lessonId) {
  const items = t().misconceptions[lessonId];
  const intro = STATE.lang === "es" ? `Errores comunes en la Lección ${lessonId}:` : STATE.lang === "hi" ? `पाठ ${lessonId} में आम गलतफहमियाँ:` : `Common misconceptions in Lesson ${lessonId}:`;
  await botSay(`<p>${intro}</p>`, 500);
  for (const m of items) {
    const html = `
      <p><span class="label">${t().ui.misconceptionLabel}</span></p>
      <p>${m.student}</p>
      <p><span class="label">${t().ui.realityLabel}</span></p>
      <p>${m.reality}</p>
      <p><span class="label">${t().ui.fixLabel}</span></p>
      <div class="quote">${m.fix}</div>`;
    await botSay(html, 1100);
  }
  setQuickReplies([
    { label: t().ui.anotherQuestion, action: flowMisconception, primary: true },
    { label: t().ui.backHome, action: returnHome, secondary: true }
  ]);
}

/* ---------- REFLECTION ---------- */
async function flowReflect() {
  await botSay(`<p>${t().reflection.start}</p>`, 500);
  setQuickReplies(t().lessonChips.map(l => ({
    label: l.label,
    action: () => reflectQ1(l.id)
  })));
}

async function reflectQ1(lessonId) {
  STATE.context = { intent: "reflect", lessonId, answers: {} };
  await botSay(`<p>${t().reflection.q1}</p>`, 500);
  setQuickReplies([
    ...t().reflection.q1Chips.map(c => ({
      label: c,
      action: () => { STATE.context.answers.worked = c; reflectQ2(); }
    }))
  ]);
}

async function reflectQ2() {
  await botSay(`<p>${t().reflection.q2}</p>`, 500);
  setQuickReplies([
    ...t().reflection.q2Chips.map(c => ({
      label: c,
      action: () => { STATE.context.answers.struggle = c; reflectQ3(); }
    }))
  ]);
}

async function reflectQ3() {
  await botSay(`<p>${t().reflection.q3}</p>`, 500);
  $("input-text").placeholder = t().reflection.q3Placeholder;
  $("input-text").focus();
  // Allow either typed note or "skip" via a chip
  const skipLabel = STATE.lang === "es" ? "Saltar" : STATE.lang === "hi" ? "छोड़ें" : "Skip";
  setQuickReplies([
    { label: skipLabel, action: () => finishReflect(""), secondary: true }
  ]);
  STATE.context.awaitingFreeNote = true;
}

async function finishReflect(note) {
  STATE.context.answers.note = note;
  STATE.context.awaitingFreeNote = false;
  $("input-text").placeholder = t().ui.placeholder;
  // Save
  STATE.lastLessonTaught = String(STATE.context.lessonId);
  STATE.pendingNote = note ? `${t().reflection.q3} ${note}` : null;
  localStorage.setItem("lastLessonTaught", STATE.lastLessonTaught);
  if (STATE.pendingNote) localStorage.setItem("pendingNote", STATE.pendingNote);
  else localStorage.removeItem("pendingNote");
  await botSay(`<p>${t().reflection.thanks}</p>`, 700);
  showToast(t().ui.reflectionSaved);
  const maxLesson = t().lessonChips ? t().lessonChips.length : 5;
  const nextLesson = Math.min(maxLesson, Number(STATE.context.lessonId) + 1);
  setQuickReplies([
    { label: `${t().ui.showLessonPrep}: L${nextLesson}`, action: () => showPreflight(nextLesson), primary: true },
    { label: t().ui.backHome, action: returnHome, secondary: true }
  ]);
}

/* ---------- HOME / RESET ---------- */
async function returnHome() {
  await botSay(`<p>${t().helpers.backToMenu}</p>`, 400);
  showHomeMenu();
}

function resetConversation() {
  STATE.context = null;
  STATE.chat = [];
  startConversation();
}

/* ============================================================
   FREE-TEXT MATCHING
   ============================================================ */
function matchFreeText(input) {
  const txt = input.toLowerCase();
  // Reflection note?
  if (STATE.context && STATE.context.awaitingFreeNote) {
    finishReflect(input);
    return true;
  }
  // Lesson references
  let lessonId = null;
  const maxL = t().lessonChips ? t().lessonChips.length : 13;
  for (let i = 1; i <= maxL; i++) {
    if (txt.includes(`lesson ${i}`) || txt.includes(`l${i}`) || txt.includes(`lección ${i}`) || txt.includes(`पाठ ${i}`)) {
      lessonId = i; break;
    }
  }
  // Intent words
  const preflightWords = ["pre-flight", "preflight", "prep", "tomorrow", "preparation", "preparar", "preparación", "तैयार"];
  const conceptWords = ["explain", "what is", "what's", "define", "vocabulary", "vocab", "explica", "qué es", "definir", "vocabulario", "समझ", "क्या है", "शब्दावली"];
  const misconceptionWords = ["misconception", "wrong", "mistake", "confused", "error", "confusión", "गलतफहमी", "गलत"];
  const studentQWords = ["student asked", "kid asked", "asked me", "estudiante preguntó", "preguntó", "छात्र ने पूछा", "पूछा"];
  const reflectWords = ["reflect", "after class", "how it went", "reflexionar", "después de clase", "विचार", "कक्षा के बाद"];
  if (preflightWords.some(w => txt.includes(w))) {
    if (lessonId) { showPreflight(lessonId); return true; }
    flowPreflight(); return true;
  }
  if (studentQWords.some(w => txt.includes(w))) {
    if (lessonId) { flowInMomentForLesson(lessonId); return true; }
    flowInMoment(); return true;
  }
  if (misconceptionWords.some(w => txt.includes(w))) {
    if (lessonId) { showMisconceptions(lessonId); return true; }
    flowMisconception(); return true;
  }
  if (reflectWords.some(w => txt.includes(w))) {
    flowReflect(); return true;
  }
  if (conceptWords.some(w => txt.includes(w))) {
    // Try to match a specific concept term
    for (const c of t().concepts) {
      if (txt.includes(c.term.toLowerCase())) {
        showConceptDetail(c.id); return true;
      }
    }
    flowConcept(); return true;
  }
  // No match — friendly fallback
  fallbackResponse();
  return false;
}

async function fallbackResponse() {
  await botSay(`<p>${t().helpers.noMatch}</p>`, 600);
  showHomeMenu();
}

/* ============================================================
   ONBOARDING TAB
   ============================================================ */
function renderOnboarding() {
  const view = $("onboarding-view");
  const o = t().onboarding;
  view.innerHTML = `
    <div class="onb-note">${o.banner}</div>
    ${o.cards.map(c => `
      <div class="onb-card" data-card="${c.id}">
        <div class="onb-icon">${c.icon}</div>
        <div>
          <div class="onb-title">${c.title}</div>
          <div class="onb-desc">${c.desc}</div>
        </div>
      </div>
    `).join("")}
  `;
  view.querySelectorAll(".onb-card").forEach(card => {
    card.addEventListener("click", () => onboardingCardClicked(card.dataset.card));
  });
}

async function onboardingCardClicked(cardId) {
  // Switch to chat tab and surface the relevant content
  setTab("chat");
  await wait(200);
  const content = t().onboardingDetail[cardId];
  if (cardId === "lesson-plan") {
    await botSay(content, 600);
    setQuickReplies([
      ...t().lessonChips.map(l => ({ label: l.label, action: () => showPreflight(l.id) })),
      { label: t().ui.backHome, action: returnHome, secondary: true }
    ]);
  } else {
    await botSay(content, 900);
    setQuickReplies([
      { label: t().ui.backHome, action: returnHome, primary: true }
    ]);
  }
}

function setTab(tab) {
  STATE.tab = tab;
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  if (tab === "chat") {
    $("chat").classList.remove("hidden");
    $("onboarding-view").classList.add("hidden");
    $("quick-replies").style.display = "";
    $("input-form").style.display = "";
  } else {
    $("chat").classList.add("hidden");
    $("onboarding-view").classList.remove("hidden");
    $("quick-replies").style.display = "none";
    $("input-form").style.display = "none";
    renderOnboarding();
  }
}

/* ============================================================
   LANGUAGE
   ============================================================ */
function setLang(lang) {
  STATE.lang = lang;
  localStorage.setItem("teacherAssistantLang", lang);
  document.querySelectorAll(".lang-btn").forEach(b => b.classList.toggle("active", b.dataset.lang === lang));
  renderHeader();
  // If a course is already selected, restart in new language; otherwise re-show course picker
  if (STATE.courseId) {
    resetConversation();
  } else {
    showCourseSelector();
  }
}

/* ============================================================
   TOAST
   ============================================================ */
function showToast(text) {
  const t = $("toast");
  t.textContent = text;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}

/* ============================================================
   INIT
   ============================================================ */
function init() {
  // Restore pending note
  STATE.pendingNote = localStorage.getItem("pendingNote");
  renderHeader();
  // Wire language buttons
  document.querySelectorAll(".lang-btn").forEach(b => {
    b.addEventListener("click", () => setLang(b.dataset.lang));
  });
  // Wire tabs
  document.querySelectorAll(".tab").forEach(b => {
    b.addEventListener("click", () => setTab(b.dataset.tab));
  });
  // Wire reset
  // Course switcher button (☰) — show course selector overlay
  $("course-btn").addEventListener("click", () => {
    if (STATE.tab !== "chat") setTab("chat");
    showCourseSelector();
  });
  // Reset button (↺) — restart conversation within current course
  $("reset-btn").addEventListener("click", () => {
    if (STATE.tab !== "chat") setTab("chat");
    localStorage.removeItem("lastLessonTaught");
    localStorage.removeItem("pendingNote");
    STATE.lastLessonTaught = null;
    STATE.pendingNote = null;
    resetConversation();
  });
  // Wire input form
  $("input-form").addEventListener("submit", e => {
    e.preventDefault();
    const val = $("input-text").value.trim();
    if (!val) return;
    appendBubble("out", escapeHtml(val));
    $("input-text").value = "";
    matchFreeText(val);
  });
  // Start
  startConversation();
}

document.addEventListener("DOMContentLoaded", init);
</script>
</body>
