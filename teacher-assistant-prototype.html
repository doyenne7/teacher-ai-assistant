    "studentQs": {
      "1": [
        {
          "q": "Does AI actually understand what I'm saying?",
          "a": "<p>No — AI predicts the statistically most likely next word based on patterns in its training data. It has no comprehension of meaning, no mental model of the world, and no awareness of you as a person.</p>\n            <p><span class=\"label\">Say to your class</span></p>\n            <div class=\"quote\">\"If you memorized millions of sentences, you could probably complete 'The dog barked at the…' with 'mailman' or 'stranger' — without actually knowing what a dog is. That's closer to what AI does. It matches patterns, not meaning.\"</div>"
        },
        {
          "q": "Why does AI give different answers to the same question?",
          "a": "<p>AI responses involve a controlled randomness called \"temperature.\" Each time you ask the same question, the model samples from a probability distribution — so the most likely response wins, but second- and third-most-likely responses can win too.</p>\n            <p><span class=\"label\">Say to your class</span></p>\n            <div class=\"quote\">\"Think of it like a weighted spinner. 'The cat sat on the mat' might have a 60% chance, but 'The cat sat on the rug' has a 30% chance. Every spin could land differently. That's why AI isn't perfectly consistent.\"</div>"
        },
        {
          "q": "Is a better prompt always a longer prompt?",
          "a": "<p>Not at all. A prompt is better when it's more specific, not necessarily longer. Adding irrelevant details can confuse the model just as giving a new employee too many unrelated instructions would confuse them.</p>\n            <p><span class=\"label\">Say to your class</span></p>\n            <div class=\"quote\">\"A prompt is like a work assignment. 'Write a 3-paragraph email to a parent about a missing homework, polite and professional tone' is better than a 10-sentence ramble that buries the actual task.\"</div>"
        }
      ],
      "2": [
        {
          "q": "Can AI see my face if I upload a photo?",
          "a": "<p>If you upload a photo containing faces to a multimodal AI tool, yes — the model processes the visual content including faces. Depending on the tool and its policies, that image may be stored, used to improve the model, or processed on a server you don't control.</p>\n            <p><span class=\"label\">Say to your class</span></p>\n            <div class=\"quote\">\"Ask yourself: would you hand this photo to a stranger and be okay never getting it back? If not, think twice before uploading it to an AI tool.\"</div>"
        },
        {
          "q": "Why is text + image AI better than text only?",
          "a": "<p>Multimodal AI can use visual information that is hard or impossible to describe fully in text. A photo of a rash, a diagram, a math problem on a whiteboard — these carry information that words alone don't capture. But \"better\" depends on the task: for many tasks, text alone is sufficient and adding an image adds privacy risk without benefit.</p>\n            <p><span class=\"label\">Say to your class</span></p>\n            <div class=\"quote\">\"More input isn't always better. Give AI what it needs for the task — nothing more. If you're asking for a recipe, there's no reason to upload a photo of your kitchen.\"</div>"
        },
        {
          "q": "Does AI remember my images from one session to the next?",
          "a": "<p>By default, most AI Chat tools do not retain memory between sessions — but the company storing those images might. Terms of service matter here. Some tools store uploads for a period of time for safety review or model improvement.</p>\n            <p><span class=\"label\">Say to your class</span></p>\n            <div class=\"quote\">\"'The AI forgot my image' and 'the company deleted my image' are two different things. Always read the privacy policy before uploading something sensitive.\"</div>"
        }
      ],
      "3": [
        {
          "q": "Is an LLM the same as AI?",
          "a": "<p>No — LLM (Large Language Model) is a specific type of AI. AI is the broad field; an LLM is one kind of AI system trained on massive text data to generate language. Not all AI is an LLM — image recognition, game-playing AI, and recommendation engines are different types.</p>\n            <p><span class=\"label\">Say to your class</span></p>\n            <div class=\"quote\">\"AI is like the category 'vehicle.' LLMs are one type — like 'sedan.' ChatGPT and similar tools are LLMs, but a self-driving car's navigation system uses very different AI.\"</div>"
        },
        {
          "q": "How does giving examples make AI smarter?",
          "a": "<p>When you provide examples in a prompt (one-shot or multi-shot), you're temporarily expanding the context window with patterns the model can use as a reference. It's not making the AI permanently smarter — it's giving it useful information within that conversation to match more accurately.</p>\n            <p><span class=\"label\">Say to your class</span></p>\n            <div class=\"quote\">\"It's like telling a substitute teacher: 'Here are three examples of how I grade essays.' You're not changing their brain — you're giving them a template to work from.\"</div>"
        },
        {
          "q": "If AI learned from the internet, doesn't it know everything?",
          "a": "<p>LLMs train on a large but finite snapshot of the internet up to a cutoff date — and that data is biased, incomplete, and contains errors. The model compresses patterns, not facts. It can \"know\" common patterns well and rare or recent facts poorly or not at all.</p>\n            <p><span class=\"label\">Say to your class</span></p>\n            <div class=\"quote\">\"The internet contains a lot of misinformation. If you trained on the whole internet including the wrong stuff, you'd 'know' a lot of wrong things confidently. That's part of why AI hallucinates.\"</div>"
        }
      ],
      "4": [
        {
          "q": "Why does AI make things up?",
          "a": "<p>AI doesn't make things up intentionally — it generates text by predicting what comes next based on patterns. When it doesn't have reliable pattern data for a specific fact, it still generates fluent, confident-sounding text that may not be accurate. This is a hallucination.</p>\n            <p><span class=\"label\">Say to your class</span></p>\n            <div class=\"quote\">\"AI doesn't know when it doesn't know something. It always produces an answer. Think of a student who never says 'I don't know' — they just guess confidently. Sometimes right, sometimes wrong, always certain.\"</div>"
        },
        {
          "q": "If AI can be wrong, why use it at all?",
          "a": "<p>The same logic would eliminate calculators (they fail with bad input), search engines (they return irrelevant or wrong results), and maps (they sometimes route incorrectly). Every tool has failure modes. The skill is knowing when and how to verify AI output.</p>\n            <p><span class=\"label\">Say to your class</span></p>\n            <div class=\"quote\">\"You use Google Maps even though it's sent people the wrong way. You just know to double-check when the route looks weird. Same with AI: useful tool, requires judgment.\"</div>"
        },
        {
          "q": "How do I know when AI output needs a human to check it?",
          "a": "<p>Apply a stakes test: if the output were wrong, how bad would the consequences be? Medical, legal, safety-critical, or deeply personal content always warrants human review. Casual, low-stakes content (brainstorming, first drafts) can tolerate more AI autonomy.</p>\n            <p><span class=\"label\">Say to your class</span></p>\n            <div class=\"quote\">\"Would you act on this information without checking? If the stakes are low — a playlist recommendation — maybe. If the stakes are high — a medication dose, a legal decision — always verify with a qualified human.\"</div>"
        }
      ],
      "5": [
        {
          "q": "Is AI lying when it contradicts itself?",
          "a": "<p>No — AI cannot lie because it has no beliefs, intentions, or awareness of previous responses. Each response is generated fresh from probability distributions. A contradiction is two different probable outputs, not a deliberate deception.</p>\n            <p><span class=\"label\">Say to your class</span></p>\n            <div class=\"quote\">\"Lying requires knowing the truth and choosing to say something different. AI doesn't know what it said before, and it doesn't 'know' anything in the way you do. Contradiction is a statistical artifact, not dishonesty.\"</div>"
        },
        {
          "q": "Can I make AI stop contradicting itself?",
          "a": "<p>You can reduce contradictions through prompt refinement: anchor the AI with explicit constraints (\"always respond from perspective X\"), request consistent format, specify the role it should play, and ask it to reason step-by-step before answering. You can't eliminate the possibility entirely, but you can make contradictions much less likely.</p>\n            <p><span class=\"label\">Say to your class</span></p>\n            <div class=\"quote\">\"Contradictions often happen when a prompt is ambiguous. The more specific your constraints, the less room there is for the AI to wander in multiple directions.\"</div>"
        },
        {
          "q": "Does it matter if AI contradicts itself about small things?",
          "a": "<p>For casual use, probably not. But in high-stakes contexts — a student relying on AI for research, a doctor using AI for symptom checking, a journalist using AI as a source — contradictions can cause real harm. The lesson is to calibrate your verification effort to the stakes.</p>\n            <p><span class=\"label\">Say to your class</span></p>\n            <div class=\"quote\">\"AI telling you two different things about a celebrity's height: fine. AI telling you two different things about drug interactions: potentially dangerous. The contradiction itself isn't the problem — the problem is when people don't notice it.\"</div>"
        }
      ],
      "6": [
        {
          "q": "Is AI bias the AI's fault?",
          "a": "<p>AI bias originates primarily in training data created by humans and selected by humans. The AI reflects and often amplifies patterns already present in its training data. So it's more accurate to say AI bias is a human-created problem that AI can make worse at scale.</p>\n            <p><span class=\"label\">Say to your class</span></p>\n            <div class=\"quote\">\"If you teach an AI only from history books that rarely feature women in science, what will the AI predict when you ask it to describe a scientist? The AI didn't decide to be biased — but the data it learned from was.\"</div>"
        },
        {
          "q": "Can we fix AI bias?",
          "a": "<p>Bias can be reduced through more diverse and representative training data, bias audits, fairness constraints in model training, and diverse teams building the systems. But it cannot be fully eliminated because all data reflects human choices and human history. The goal is awareness, mitigation, and accountability.</p>\n            <p><span class=\"label\">Say to your class</span></p>\n            <div class=\"quote\">\"Bias is not a one-time bug to fix — it's an ongoing challenge to manage. The question isn't 'is this AI biased?' but 'how is it biased, for whom, and what are we doing about it?'\"</div>"
        },
        {
          "q": "Am I biased if I sort resumes the same way as AI?",
          "a": "<p>Possibly — and that's the point. Bias isn't a character flaw; it's a pattern that forms from the environment you've grown up in. When human bias matches AI bias, it's often because both learned from the same societal patterns. Noticing the match is the first step to questioning it.</p>\n            <p><span class=\"label\">Say to your class</span></p>\n            <div class=\"quote\">\"If your rankings and the AI's rankings are suspiciously similar, ask yourself: did you use the same criteria? What signals did you both respond to? Were those signals actually relevant to job performance?\"</div>"
        }
      ],
      "7": [
        {
          "q": "How do I know if something AI told me is a hallucination?",
          "a": "<p>You often can't tell from the AI output itself — hallucinations are delivered with the same confident, fluent style as accurate information. The way to detect them is external verification: check the claim against a reliable, independent source. If you can't find corroboration for a specific fact, treat it as unverified.</p>\n            <p><span class=\"label\">Say to your class</span></p>\n            <div class=\"quote\">\"AI doesn't give you a 'I made this up' warning. It delivers hallucinations in the same font, the same confident tone, as correct information. Your job is to be the detective — verify before you repeat or act on it.\"</div>"
        },
        {
          "q": "What should I do if I've already shared something that was a hallucination?",
          "a": "<p>Correct it as soon as you can, clearly and directly. Misinformation spreads faster than corrections, so speed matters. Note where you sourced the claim, acknowledge it was AI-generated and unverified, and share the correct information with a reliable source citation.</p>\n            <p><span class=\"label\">Say to your class</span></p>\n            <div class=\"quote\">\"The mistake isn't using AI — it's sharing AI output without verification. If you've already shared it, the responsible move is a clear correction: 'I shared this earlier but it turns out it was inaccurate — here's the correct information.'\"</div>"
        },
        {
          "q": "Do all AI tools hallucinate?",
          "a": "<p>All current large language models have the potential to hallucinate — it's inherent to how they generate text. Some models are more reliable than others, and some domains (common knowledge, well-represented topics) produce fewer hallucinations than others (recent events, obscure facts, specific citations). But none are immune.</p>\n            <p><span class=\"label\">Say to your class</span></p>\n            <div class=\"quote\">\"It's not a matter of which AI to trust completely — it's a matter of developing habits: verify high-stakes claims, use AI as a starting point not an endpoint, and never cite AI as a primary source.\"</div>"
        }
      ],
      "8": [
        {
          "q": "Do I always need to use all five elements of the framework?",
          "a": "<p>No — the Task/Context/Reference/Format/Tone framework is a diagnostic tool, not a checklist. Simple tasks may only need Task + Format. The framework helps you notice what's missing when a prompt fails, not prescribe a formula you must always follow.</p>\n            <p><span class=\"label\">Say to your class</span></p>\n            <div class=\"quote\">\"Think of it as a toolbox, not a recipe. When your output isn't what you wanted, ask: what element was I missing? Then add that element and try again.\"</div>"
        },
        {
          "q": "What's the difference between Context and Reference?",
          "a": "<p>Context is background information about the situation (\"I'm a 10th grader writing an essay for English class\"). Reference is a specific example, template, or source you want the AI to draw from or match (\"Write it in the style of this paragraph I'm providing\"). Context sets the scene; Reference gives a model to follow.</p>\n            <p><span class=\"label\">Say to your class</span></p>\n            <div class=\"quote\">\"Context: 'I'm cooking for someone who doesn't eat dairy.' Reference: 'Here's a recipe I love — adapt it to be dairy-free.' Both are helpful, but they do different jobs.\"</div>"
        },
        {
          "q": "Why does Tone matter so much?",
          "a": "<p>Tone shapes how content lands with an audience. \"Write a persuasive argument\" and \"write a persuasive argument in a friendly, conversational tone for peers\" produce very different outputs. Without specifying tone, AI defaults to a generic, slightly formal register that may not fit the audience.</p>\n            <p><span class=\"label\">Say to your class</span></p>\n            <div class=\"quote\">\"You'd talk differently to your best friend, a college interviewer, and your grandparent — even about the same topic. Telling AI the tone is like telling it who it's talking to.\"</div>"
        }
      ],
      "9": [
        {
          "q": "If AI does most of the work, is it still my project?",
          "a": "<p>Authorship in human-AI collaboration is a real and unresolved question — but the key factor is human direction, curation, and judgment. If you decided what to make, chose what to keep, edited what didn't fit, and added your own perspective, you are the author even if AI generated raw material.</p>\n            <p><span class=\"label\">Say to your class</span></p>\n            <div class=\"quote\">\"A film director doesn't operate the camera, act in every scene, or compose the music. But the film is theirs. Co-creation means you're the director — AI is part of your crew.\"</div>"
        },
        {
          "q": "What's decomposition and why does it matter for AI?",
          "a": "<p>Decomposition means breaking a complex task into smaller, manageable sub-tasks. It matters for AI because large, vague requests produce vague results. When you decompose, you can assign each sub-task a targeted prompt — and you can identify which parts AI can help with and which require human judgment.</p>\n            <p><span class=\"label\">Say to your class</span></p>\n            <div class=\"quote\">\"'Plan my whole campaign' is too big for AI to do well. But 'give me 10 name ideas for a club focused on environmental action' is specific enough to get useful results. Decomposition turns big fuzzy problems into small, promptable pieces.\"</div>"
        },
        {
          "q": "Can AI come up with ideas that are actually creative?",
          "a": "<p>AI can generate novel combinations of patterns from its training data — which can appear creative, and sometimes produce genuinely surprising ideas. But AI doesn't have intentions, experiences, or stakes in the outcome. Human creativity involves all three. AI is best thought of as a creative accelerator, not a creative peer.</p>\n            <p><span class=\"label\">Say to your class</span></p>\n            <div class=\"quote\">\"AI can suggest 50 campaign names in 10 seconds. Some will be terrible, some surprisingly good. Your job is to recognize which is which — and that judgment is a creative act AI can't replicate.\"</div>"
        }
      ],
      "10": [
        {
          "q": "Is remixing someone else's work the same as copying it?",
          "a": "<p>No — remix involves transforming, combining, or building on existing work to create something new. Copying reproduces it unchanged. The legal and ethical lines get complicated with AI because the model trained on copyrighted work without explicit permission, which is currently contested in courts worldwide.</p>\n            <p><span class=\"label\">Say to your class</span></p>\n            <div class=\"quote\">\"Sampling a beat and adding new lyrics is remix. Releasing someone else's song under your name is copying. AI-generated work trained on artists' work without permission sits in a legally gray area that courts are still working out.\"</div>"
        },
        {
          "q": "Can AI-generated work ever be truly original?",
          "a": "<p>This is genuinely debated among philosophers, artists, and legal scholars. AI recombines patterns from training data — it doesn't start from nothing, have experiences, or make intentional choices. Whether that recombination constitutes \"originality\" depends on your definition. Most definitions of originality include intentionality and personal expression, which AI lacks.</p>\n            <p><span class=\"label\">Say to your class</span></p>\n            <div class=\"quote\">\"If originality requires intent and personal experience, AI can't be original — it has neither. If originality just means 'hasn't existed before,' then maybe. What do YOU think originality requires?\"</div>"
        },
        {
          "q": "If I edit AI output, is the final work original?",
          "a": "<p>More so than unedited AI output. The key questions: How much did you change? Did you add your own perspective, voice, and judgment? Did the editing require creative decisions? If the answer to those is yes, the final work has meaningful human authorship — even if it started as AI output.</p>\n            <p><span class=\"label\">Say to your class</span></p>\n            <div class=\"quote\">\"Editing three words in a 500-word AI essay is not the same as rewriting it to sound like you. The degree of human creative input matters. Ask yourself: does this represent my thinking, my voice, my choices?\"</div>"
        }
      ],
      "11": [
        {
          "q": "Who owns art that AI creates?",
          "a": "<p>Currently, in the US, copyright requires human authorship — purely AI-generated work without human creative input may not be copyrightable. Works where a human made significant creative choices (prompt crafting, selection, editing) may be partially protected. Laws are actively changing and vary by country.</p>\n            <p><span class=\"label\">Say to your class</span></p>\n            <div class=\"quote\">\"In 2023, the US Copyright Office ruled that AI-generated images without human creative input are not copyrightable. But what counts as 'enough' human input? That question is still being decided in courts.\"</div>"
        },
        {
          "q": "Is it ethical to use AI art if artists didn't consent to training?",
          "a": "<p>This is genuinely contested. Artists argue that training on their work without consent or compensation is unfair and economically harmful. AI companies argue training on publicly available data is like a human artist learning from other artists. There is no consensus — but both positions have merit, and the power imbalance between individual artists and large AI companies is real.</p>\n            <p><span class=\"label\">Say to your class</span></p>\n            <div class=\"quote\">\"There's no easy answer here. The question isn't just legal — it's about fairness, power, and what we value as a society. What would you want if someone trained an AI on your creative work and sold the results?\"</div>"
        },
        {
          "q": "Does attribution fix the ethics of using AI-generated content?",
          "a": "<p>Attribution is necessary but not always sufficient. It's honest and it's better than not attributing — but attribution doesn't compensate artists for economic harm, doesn't address consent issues, and doesn't resolve authorship questions. It's one part of ethical practice, not the whole solution.</p>\n            <p><span class=\"label\">Say to your class</span></p>\n            <div class=\"quote\">\"If someone used your photos without asking and credited you afterward, would that feel fair? Attribution matters — and there's often more to it than that.\"</div>"
        }
      ],
      "12": [
        {
          "q": "Is AI actually being used in my community?",
          "a": "<p>Almost certainly yes — often invisibly. AI powers content recommendation on social media, hiring screening tools used by local employers, credit scoring at banks, predictive tools used by local police, and diagnostic aids in nearby hospitals. The question is rarely whether AI is present, but where and how.</p>\n            <p><span class=\"label\">Say to your class</span></p>\n            <div class=\"quote\">\"Think about the last time you got a recommendation — Netflix, Spotify, Amazon, your Instagram feed. All AI. Think about college admissions, job applications, loan approvals in your area. AI is likely involved. The question is: do you have any say in how it's used?\"</div>"
        },
        {
          "q": "Who do I write my call to action to?",
          "a": "<p>Identify the specific decision-maker who has the power to make the change you're asking for. For school-based AI use: a principal or school board. For local government AI: a city council member. For a company's AI product: their public policy or trust and safety team. Generic calls to action (\"everyone should care\") are less effective than targeted ones.</p>\n            <p><span class=\"label\">Say to your class</span></p>\n            <div class=\"quote\">\"'Society should fix AI bias' is not a call to action — it's a wish. 'The school board should require an annual bias audit of any AI tools used in admissions' is a call to action. Specific, to the right person, asking for a concrete thing.\"</div>"
        },
        {
          "q": "Can one person actually change how AI is used?",
          "a": "<p>Policy changes, algorithmic accountability laws, and corporate decisions about AI have been influenced by individual advocates, student campaigns, and community organizing. Change at scale requires collective action, but individuals can start conversations, shift opinions, and create pressure. Many civil rights advocates started as individuals.</p>\n            <p><span class=\"label\">Say to your class</span></p>\n            <div class=\"quote\">\"The lawmakers who wrote the EU AI Act were individual people with individual convictions who worked with others. The artists who filed lawsuits against AI companies were individuals. You don't have to change the world alone — but you have to start somewhere.\"</div>"
        }
      ],
      "13": [
        {
          "q": "How much of this project should be AI vs. me?",
          "a": "<p>The rubric prioritizes human reasoning, ethical reflection, and student voice. AI should be a documented collaborator — used for research, generating options, and drafting. But every prediction, every ethical argument, and every personal reflection should be genuinely yours. Think of AI as a research assistant, not a ghostwriter.</p>\n            <p><span class=\"label\">Say to your class</span></p>\n            <div class=\"quote\">\"Your collaboration log should show that AI helped you — but your presentation should show that you thought. The AI's job is to give you more to work with. Your job is to make sense of it, evaluate it, and add what only you can add.\"</div>"
        },
        {
          "q": "What if my prediction turns out to be wrong?",
          "a": "<p>That's fine — predictions about complex systems are rarely perfectly accurate, and that's not what this project is evaluating. The rubric rewards quality of reasoning, not correctness of prediction. A well-argued, ethically reasoned prediction that turns out to be wrong is better than a vague prediction that happens to be right.</p>\n            <p><span class=\"label\">Say to your class</span></p>\n            <div class=\"quote\">\"You're not being graded on whether you predicted the future correctly. You're being graded on how thoughtfully you reasoned, how honestly you engaged with the ethics, and how clearly you explained your process.\"</div>"
        },
        {
          "q": "Do I have to use AI in this project?",
          "a": "<p>The project is specifically designed to involve AI collaboration — that's what makes it a summative assessment for this unit. Using AI isn't optional, but how you use it and what you do with it is up to you. The AI collaboration log documents your process — so the more intentional your AI use, the richer your log.</p>\n            <p><span class=\"label\">Say to your class</span></p>\n            <div class=\"quote\">\"This project is about showing what you've learned about working with AI. You can't show that without actually working with AI. But you're in charge of the project — AI is your tool, not your boss.\"</div>"
        }
      ]
    },

        {
          "student": "AI contradicts itself because it's broken or poorly programmed.",
          "reality": "Contradictions are an expected feature of probabilistic text generation, not a bug. Each response is a fresh sample from a distribution — different samples can be inconsistent.",
          "fix": "\"Flip the framing: 'What would it mean if AI always gave identical responses? Would that be better or worse?' Helps students see why some randomness is designed in.\""
        },
        {
          "student": "Prompt refinement always eliminates contradictions.",
          "reality": "Prompt refinement can reduce contradictions significantly but cannot eliminate them entirely. LLMs are inherently probabilistic.",
          "fix": "\"Have students test their most refined prompt 5 times in a row — they'll usually see at least one variation, showing that probabilities can't be set to zero.\""
        },
        {
          "student": "AI contradictions don't matter in the real world.",
          "reality": "In high-stakes contexts — medical information, legal guidance, safety instructions — AI contradictions can cause genuine harm.",
          "fix": "\"Present the medical dosage scenario: AI says 200mg on one query, 400mg on another. Would you act on either without verification?\""
        }
      ],
      "6": [
        {
          "student": "AI is objective because it uses data, not feelings.",
          "reality": "Data reflects the world as it has been, not as it should be. If historical data is biased, AI learns and amplifies those biases. Objectivity requires unbiased data — which doesn't exist.",
          "fix": "\"Ask: 'If a hiring AI trained on 1980s hiring decisions, would it be objective today?' The data is from a time when discrimination was common — the 'objective' output would be discriminatory.\""
        },
        {
          "student": "Only AI systems with bad programming are biased.",
          "reality": "Well-engineered AI can still be biased if training data is biased. Bias is a data problem as much as an engineering problem.",
          "fix": "\"Separate the concepts: 'The code can be perfect and the output still biased.' Have students identify where in the pipeline bias enters — data collection, labeling, or model training.\""
        },
        {
          "student": "Bias in AI only affects marginalized groups.",
          "reality": "Bias can affect anyone depending on context — overconfident medical AI could harm any demographic; biased financial AI could affect any loan applicant.",
          "fix": "\"Ask: 'Can you imagine a scenario where AI bias could affect you personally?' This helps students see bias as a systemic issue, not someone else's problem.\""
        }
      ],
      "7": [
        {
          "student": "I can tell when AI is making something up.",
          "reality": "Hallucinations are generated with the same fluent, confident style as accurate information. There are no reliable surface signals that distinguish hallucination from accurate output.",
          "fix": "\"Give students a paragraph that is 80% accurate with one hallucinated sentence. Ask them to identify it without external research — most can't. Then let them use fact-checking tools.\""
        },
        {
          "student": "Fact-checking every AI output is impractical.",
          "reality": "Fact-checking every output is impractical — and not the goal. The goal is calibrating verification effort to stakes. High-stakes claims warrant verification; low-stakes use doesn't always.",
          "fix": "\"Have students categorize 10 use cases by stakes: 'Does this need verification?' This builds intuition for when fact-checking is proportionate.\""
        },
        {
          "student": "Better AI tools don't hallucinate.",
          "reality": "All current LLMs hallucinate. Some do so less frequently, but none are immune. Capability improvements reduce hallucination rate but don't eliminate it.",
          "fix": "\"Test the most capable available AI tool on a specific local fact or obscure statistic. Students will often find hallucinations even in 'advanced' models.\""
        }
      ],
      "8": [
        {
          "student": "The T-C-R-F-T framework must be used in order.",
          "reality": "The framework elements can be arranged in any order that serves clarity. The framework is a diagnostic tool — not a rigid syntax.",
          "fix": "\"Have students write the same prompt with elements in different orders and compare outputs. The order rarely matters — the presence of elements does.\""
        },
        {
          "student": "More elements in the framework always produce better results.",
          "reality": "Including all five elements for a simple task adds unnecessary complexity. Match the depth of your prompt to the complexity of the task.",
          "fix": "\"Demonstrate: a simple task ('translate this sentence to Spanish') doesn't need all five elements. Adding them all makes the prompt longer without improving the output.\""
        },
        {
          "student": "Prompt engineering is a skill only developers need.",
          "reality": "Anyone who uses AI tools — students, teachers, doctors, writers, lawyers — benefits from prompt engineering skills. It's increasingly a professional literacy.",
          "fix": "\"Survey students: 'Have you ever gotten a bad AI response and not known how to fix it?' Almost everyone has. Prompt engineering is the skill that fixes that.\""
        }
      ],
      "9": [
        {
          "student": "If AI generated most of the content, I didn't really do the work.",
          "reality": "Directing, curating, editing, and evaluating AI output is real intellectual work. Co-creation requires more skill than either doing it alone or having AI do it alone.",
          "fix": "\"Compare: a film producer doesn't write the script, act, or direct — but we recognize their work as real. The work of co-creation is in the judgment and direction.\""
        },
        {
          "student": "AI brainstorming is the same as human brainstorming.",
          "reality": "AI generates options based on patterns in training data — it can surface common combinations quickly, but it won't have your stake in the outcome, your cultural context, or your genuine surprise at an idea.",
          "fix": "\"Have students notice which AI-generated ideas feel generic vs. surprising. Then ask: why was the surprising one surprising? Usually because it was an unusual combination — which students can then own and develop.\""
        },
        {
          "student": "Good AI output means the task is done.",
          "reality": "AI output is a draft — a starting point. Co-creation requires human review, editing, and judgment to produce a final product that reflects human intent and quality.",
          "fix": "\"Ask students to read AI output and identify: 'What's missing? What doesn't sound right? What would I change?' That gap between AI output and what they want is where their work lives.\""
        }
      ],
      "10": [
        {
          "student": "If it looks new, it's original.",
          "reality": "Originality requires more than novelty — it involves intentionality, personal expression, and creative choices. AI can produce novel-looking combinations without any of these.",
          "fix": "\"Compare: a random word generator can produce word combinations no one has ever seen. Are those original? Why or why not?\""
        },
        {
          "student": "Remixing AI output is the same as remixing human creative work.",
          "reality": "Human creative work was produced with intent and personal expression; AI output was produced by pattern matching. Remixing AI output raises different but real ethical questions about the training data underlying it.",
          "fix": "\"Ask: 'What were you remixing when you remixed AI output?' If the AI trained on copyrighted work, the remix may be two steps removed from the original source.\""
        },
        {
          "student": "AI cannot be creative.",
          "reality": "Whether AI is 'creative' depends on how you define creativity. AI can produce novel, surprising, aesthetically interesting outputs. Whether that constitutes creativity — or just sophisticated pattern recombination — is a genuine philosophical debate.",
          "fix": "\"Don't shut this down — open it up. Ask: 'What would creativity require that AI doesn't have? Now make a case for the other side.' The richest discussions come from holding both views.\""
        }
      ],
      "11": [
        {
          "student": "Copyright law clearly covers AI-generated work.",
          "reality": "Copyright law was written before generative AI existed, and courts and legislators are actively working through how existing law applies. The situation is genuinely unsettled.",
          "fix": "\"Show students a recent news headline about an AI copyright case. Emphasize: this is unsettled law, not established fact. Their generation will help decide how it develops.\""
        },
        {
          "student": "If an AI company uses your work for training, you can't do anything about it.",
          "reality": "Artists and creators have filed lawsuits, sought legislation, and built opt-out databases. Legal remedies are limited but growing. Collective action has produced some changes.",
          "fix": "\"Research with students: 'What has actually happened in AI training data lawsuits? What has worked, what hasn't?' This connects ethics to real-world outcomes.\""
        },
        {
          "student": "Ethics is just personal opinion.",
          "reality": "Ethical reasoning involves evidence, argument, and consequences — not just feelings. Structured ethical frameworks (fairness, harm reduction, rights) help analyze tradeoffs systematically.",
          "fix": "\"Ask students to argue a position they personally disagree with, using one of the ethical frameworks. This shows ethics as reasoning, not just opinion.\""
        }
      ],
      "12": [
        {
          "student": "AI's societal impacts are only relevant in big cities or wealthy countries.",
          "reality": "AI affects rural communities (automated farming tools, limited internet access), developing nations (AI in healthcare where doctors are scarce), and every demographic. The harms often fall hardest on those with least power to resist.",
          "fix": "\"Pick an example close to home: 'How does the algorithm that decides which job postings you see affect someone in this town who is looking for work?'\""
        },
        {
          "student": "Tech companies are responsible for all AI harms.",
          "reality": "Responsibility is distributed: companies that build systems, governments that regulate them, organizations that deploy them, and individuals who use them all bear some responsibility.",
          "fix": "\"Map the responsibility chain for a specific AI harm. Who built it? Who approved its deployment? Who trained it? Who used it? Responsibility rarely sits with one actor.\""
        },
        {
          "student": "A call to action must solve the whole problem.",
          "reality": "Effective calls to action are specific and achievable — they ask for one concrete change, from a specific person with the power to make it, with a clear justification.",
          "fix": "\"Have students rate 5 sample calls to action on specificity. The vague ones ('fix AI bias') are easy to identify — help students see what makes the specific ones more likely to produce change.\""
        }
      ],
      "13": [
        {
          "student": "This project is about predicting the future correctly.",
          "reality": "The project evaluates quality of reasoning, ethical reflection, and use of evidence — not accuracy of prediction. Thoughtful analysis of uncertainty is more valuable than a confident guess.",
          "fix": "\"Show students how professional forecasters like Superforecasters communicate predictions — with probabilities and reasoning, not certainty. That's the model for this project.\""
        },
        {
          "student": "The AI collaboration log is just a formality.",
          "reality": "The collaboration log is a primary assessment artifact. It shows the quality of the student's prompting, their iterative process, and how their thinking evolved through AI interaction.",
          "fix": "\"Share an exemplary log alongside a weak one. Students quickly see the difference between a thoughtful process record and an afterthought log.\""
        },
        {
          "student": "A polished presentation is the most important thing.",
          "reality": "While presentation quality matters, the rubric prioritizes substance: quality of the prediction argument, depth of ethical reasoning, and authenticity of student voice. A polished presentation of shallow thinking scores below a rougher presentation of deep thinking.",
          "fix": "\"Review the rubric together before students start. Have them highlight what the rubric values most. This resets expectations early.\""
        }
      ]
    },

    "onboardingDetail": {
      "start": "<p><span class=\"label\">Where to start</span></p>\n      <p>The unit is <strong>13 lessons × 45 min</strong>, for Grades 9–12. No coding background required for students or teachers.</p>\n      <p><strong>Your first 30 minutes:</strong></p>\n      <ul>\n        <li>Watch the <em>Problem Solving with AI</em> intro video (5 min)</li>\n        <li>Try Level 1 yourself — do the \"Yes, and…\" game mentally (5 min)</li>\n        <li>Skim the Unit Guide so you know what students are tracking (10 min)</li>\n        <li>Review Lesson 1's pre-flight in this assistant (5 min)</li>\n      </ul>\n      <p><strong>Key planning note:</strong> Lessons 9 and 13 require more prep time than average. Build in time to read those before you reach them.</p>",
      "syllabus": "<p><span class=\"label\">Syllabus</span></p>\n      <ul>\n        <li><strong>L1</strong> · Talking to Machines — Prompting basics, probability, abstraction</li>\n        <li><strong>L2</strong> · Beyond Words — Multimodal AI, privacy risks</li>\n        <li><strong>L3</strong> · The AI's Brain — LLM training, neural networks, shot prompting</li>\n        <li><strong>L4</strong> · Smart or Just Predictable? — Strengths, weaknesses, hallucinations</li>\n        <li><strong>L5</strong> · Uncovering Contradictions — Prompt refinement, probabilistic outputs</li>\n        <li><strong>L6</strong> · Understanding Bias — Training data, fairness, Career Clothing</li>\n        <li><strong>L7</strong> · AI's Wild Imagination — Hallucination cases, fact-checking</li>\n        <li><strong>L8</strong> · Debugging & Refining — T-C-R-F-T prompt framework</li>\n        <li><strong>L9</strong> · AI as Co-Creator — Campaign project, decomposition</li>\n        <li><strong>L10</strong> · Remixing & Originality — Human vs. AI creativity, remix</li>\n        <li><strong>L11</strong> · Ownership & Ethics — IP, attribution, discussion stations</li>\n        <li><strong>L12</strong> · AI's Role in Society — Community impact, stakeholders, call to action</li>\n        <li><strong>L13</strong> · Time Capsule Project — Summative: prediction + ethical reflection</li>\n      </ul>",
      "lesson-plan": "<p>Pick a lesson above and I'll walk you through the full plan step by step.</p>",
      "sample": "<p><span class=\"label\">Sample activity</span></p>\n      <p>Best starting point: <strong>Lesson 1, Level 2</strong> — try prompting AI Chat with a generic vs. specific prompt for the same task and compare the results yourself.</p>\n      <p>Then try <strong>Lesson 8</strong> — use the Task/Context/Reference/Format/Tone framework on a real prompt you care about. Notice which elements improve the output most.</p>\n      <p>Both are short enough to experience in under 10 minutes and will give you direct insight into what students encounter.</p>",

        "header": "Lección 1 · Hablar con Máquinas · 45 min",
        "body": "<p><span class=\"label\">Preparación</span></p>\n        <p><strong>Lo que enseñarás:</strong> Cómo la IA genera respuestas mediante reconocimiento de patrones y probabilidad. Los estudiantes experimentan con instrucciones de texto en AI Chat y descubren que la IA predice, no comprende.</p>\n        <p><strong>Vocabulario nuevo (4):</strong> Prompt (instrucción), Probabilidad, Abstracción, Inteligencia Artificial</p>\n        <p><strong>Actividades:</strong></p>\n        <ul>\n          <li>Juego de calentamiento \"Sí, y…\" (parejas o grupos, 10 min) — simula la construcción de respuestas aditiva de la IA</li>\n          <li>Nivel 1: Predicciones de IA — los estudiantes predicen la siguiente palabra en oraciones y comparan con el resultado de la IA</li>\n          <li>Niveles 2–4: Instrucciones a la IA — de prompts genéricos a específicos, observar cómo cambia la calidad</li>\n          <li>Nivel 5: Práctica de instrucciones (nivel de elección) — exploración abierta</li>\n        </ul>\n        <p><strong>Verificación tecnológica:</strong> Imprime el Unit Guide (uno por estudiante). Distribúyelo antes del Nivel 1. Confirma que AI Chat es accesible en los dispositivos de los estudiantes.</p>\n        <p><strong>⚡ Ojo con esto:</strong> Los estudiantes creen que la IA \"entiende\" el prompt. Enfatiza: la IA predice la siguiente palabra más probable — sin significado, sin comprensión. El juego \"Sí, y…\" es tu mejor analogía.</p>",

        "body": "<p><span class=\"label\">Preparación</span></p>\n        <p><strong>Lo que enseñarás:</strong> La IA multimodal puede procesar texto e imágenes. Los estudiantes comparan respuestas de IA solo con texto versus texto más imagen, y exploran los riesgos de privacidad de compartir fotos con la IA.</p>\n        <p><strong>Vocabulario nuevo (2):</strong> Multimodal AI, Privacidad</p>\n        <p><strong>Actividades:</strong></p>\n        <ul>\n          <li>Calentamiento: los estudiantes describen una imagen con palabras — notan qué se pierde en la traducción</li>\n          <li>Nivel 1: Prompt solo de texto vs. el mismo prompt con imagen — los estudiantes documentan diferencias</li>\n          <li>Nivel 2: Privacidad en primer plano — ¿qué datos contiene una foto? (metadatos, rostros, ubicación)</li>\n          <li>Nivel 3: Debate/discusión — ¿cuándo es apropiado compartir una imagen con la IA?</li>\n        </ul>\n        <p><strong>Verificación tecnológica:</strong> Verifica que la herramienta AI Chat admita subida de imágenes en la red escolar. Ten un conjunto de imágenes de muestra listo por si los estudiantes no pueden subir fotos.</p>\n        <p><strong>⚡ Ojo con esto:</strong> Los estudiantes asumen que la IA con imágenes siempre es mejor. Discute las desventajas: mayor capacidad implica mayor exposición de privacidad. Recuerda: una vez que subes una imagen, ya compartiste esos datos.</p>",

        "body": "<p><span class=\"label\">Preparación</span></p>\n        <p><strong>Lo que enseñarás:</strong> Cómo se entrenan los Modelos de Lenguaje Grande usando redes neuronales. Los estudiantes experimentan el poder del contexto a través de una actividad sin tecnología, luego practican prompting de cero disparos, un disparo y múltiples disparos.</p>\n        <p><strong>Vocabulario nuevo (4):</strong> Large Language Model (LLM), Neural Network, Ventana de contexto, Shot prompting</p>\n        <p><strong>Actividades:</strong></p>\n        <ul>\n          <li>Actividad sin tecnología de red neuronal: predecir una palabra sin contexto, luego con una oración, luego con un párrafo — notar cómo mejora la precisión</li>\n          <li>Nivel 1: Zero-shot prompting — preguntar a la IA sin ningún ejemplo</li>\n          <li>Nivel 2: One-shot prompting — dar a la IA un ejemplo antes de la tarea</li>\n          <li>Nivel 3: Multi-shot prompting — dar varios ejemplos, observar mejora en calidad</li>\n          <li>Síntesis: ¿cuándo usar cada tipo?</li>\n        </ul>\n        <p><strong>Verificación tecnológica:</strong> No se necesita configuración especial además de AI Chat. Prepara las tarjetas de predicción sin tecnología si usas materiales impresos.</p>\n        <p><strong>⚡ Ojo con esto:</strong> Los estudiantes confunden \"red neuronal\" con el cerebro humano. Las redes neuronales están inspiradas vagamente en las neuronas pero son funciones matemáticas, no biología.</p>",

        "body": "<p><span class=\"label\">Preparación</span></p>\n        <p><strong>Lo que enseñarás:</strong> La IA tiene fortalezas reales (velocidad, amplitud, consistencia) y debilidades reales (alucinaciones, conocimiento desactualizado, sin juicio). Los estudiantes comparan respuestas de IA y humanas para decidir cuándo es necesaria la supervisión humana.</p>\n        <p><strong>Vocabulario nuevo (2):</strong> Alucinación, Supervisión humana</p>\n        <p><strong>Actividades:</strong></p>\n        <ul>\n          <li>Comparación lado a lado: la misma pregunta respondida por IA y por un humano experto — ¿qué difiere?</li>\n          <li>Nivel 1: Fortalezas de la IA — tareas que la IA hace bien (resumir, traducir, generar opciones)</li>\n          <li>Nivel 2: Debilidades de la IA — provocar deliberadamente una alucinación preguntando sobre un tema muy oscuro o reciente</li>\n          <li>Nivel 3: Escenarios de supervisión humana — consejos médicos, asesoría legal, apoyo emocional</li>\n          <li>Checkpoint del Unit Guide: registrar ejemplos de fortalezas y debilidades de la IA</li>\n        </ul>\n        <p><strong>Verificación tecnológica:</strong> No hay herramientas nuevas. Esta lección es ideal para usar el Unit Guide para tomar notas estructuradas.</p>\n        <p><strong>⚡ Ojo con esto:</strong> Después de ver alucinaciones, algunos estudiantes concluyen \"la IA es inútil.\" Contrarréstalo: la IA es una herramienta poderosa que requiere verificación humana — como una calculadora que ocasionalmente arroja resultados sin sentido.</p>",

        "header": "Lección 5 · Descubriendo Contradicciones · 45 min",
        "body": "<p><span class=\"label\">Preparación</span></p>\n        <p><strong>Lo que enseñarás:</strong> La IA puede contradecirse porque genera respuestas de forma probabilística, no a partir de un sistema de creencias interno consistente. Los estudiantes aprenden a inducir contradicciones y luego a refinar prompts para eliminarlas.</p>\n        <p><strong>Vocabulario nuevo (2):</strong> Contradicción, Refinamiento de prompts</p>\n        <p><strong>Actividades:</strong></p>\n        <ul>\n          <li>Calentamiento: leer dos respuestas de IA sobre el mismo tema que dicen cosas opuestas — discutir por qué ocurre esto</li>\n          <li>Nivel 1: Inducir una contradicción — preguntar lo mismo dos veces o reformular para obtener respuestas contradictorias</li>\n          <li>Nivel 2: Refinamiento de prompts — añadir restricciones, especificar formato, usar definición de rol para reducir contradicciones</li>\n          <li>Nivel 3: Impacto en el mundo real — discutir un escenario donde una contradicción de IA causó daño real (dosis médica, navegación)</li>\n          <li>Cierre: ¿qué estrategias de refinamiento fueron más efectivas?</li>\n        </ul>\n        <p><strong>Verificación tecnológica:</strong> No hay herramientas nuevas. Considera capturar pantallas de las contradicciones para la discusión en clase.</p>\n        <p><strong>⚡ Ojo con esto:</strong> Los estudiantes creen que las contradicciones significan que la IA está \"rota\" o \"mintiendo.\" Aclara: la IA no tiene creencias. Cada respuesta es una nueva extracción probabilística.</p>",

        {
          "q": "Si la IA aprendió de internet, ¿no lo sabe todo?",
          "a": "<p>Los LLMs se entrenan en una instantánea grande pero finita de internet hasta una fecha límite — y esos datos están sesgados, son incompletos y contienen errores. El modelo comprime patrones, no hechos. Puede \"saber\" bien los patrones comunes y los hechos raros o recientes, poco o nada.</p>\n            <p><span class=\"label\">Di a tu clase</span></p>\n            <div class=\"quote\">\"Internet contiene mucha desinformación. Si te entrenaste con todo internet incluyendo lo incorrecto, 'sabrías' muchas cosas incorrectas con confianza. Eso es parte de por qué la IA alucina.\"</div>"
        }
      ],
      "4": [
        {
          "q": "¿Por qué la IA inventa cosas?",
          "a": "<p>La IA no inventa cosas intencionalmente — genera texto prediciendo qué viene después basándose en patrones. Cuando no tiene datos de patrones confiables para un hecho específico, sigue generando texto fluido y con sonido seguro que puede no ser preciso. Esto es una alucinación.</p>\n            <p><span class=\"label\">Di a tu clase</span></p>\n            <div class=\"quote\">\"La IA no sabe cuándo no sabe algo. Siempre produce una respuesta. Piensa en un estudiante que nunca dice 'no sé' — simplemente adivina con confianza. A veces correcto, a veces incorrecto, siempre seguro.\"</div>"
        },
        {
          "q": "Si la IA puede estar equivocada, ¿para qué usarla?",
          "a": "<p>La misma lógica eliminaría las calculadoras, los motores de búsqueda y los mapas — todos tienen modos de fallo. Cada herramienta tiene fallas. La habilidad es saber cuándo y cómo verificar el resultado de la IA.</p>\n            <p><span class=\"label\">Di a tu clase</span></p>\n            <div class=\"quote\">\"Usas Google Maps aunque a veces te manda por el camino equivocado. Solo sabes que debes verificar cuando la ruta parece extraña. Igual con la IA: herramienta útil, requiere juicio.\"</div>"
        },
        {
          "q": "¿Cómo sé cuándo el resultado de IA necesita que un humano lo revise?",
          "a": "<p>Aplica una prueba de apuestas: si el resultado fuera incorrecto, ¿qué tan malas serían las consecuencias? El contenido médico, legal, de seguridad crítica o profundamente personal siempre requiere revisión humana.</p>\n            <p><span class=\"label\">Di a tu clase</span></p>\n            <div class=\"quote\">\"¿Actuarías con esta información sin verificarla? Si las apuestas son bajas — una recomendación de lista de reproducción — tal vez. Si las apuestas son altas — una dosis de medicamento, una decisión legal — siempre verifica con un humano calificado.\"</div>"
        }
      ],
      "5": [
        {
          "q": "¿La IA está mintiendo cuando se contradice?",
          "a": "<p>No — la IA no puede mentir porque no tiene creencias, intenciones ni conciencia de respuestas anteriores. Cada respuesta se genera fresca a partir de distribuciones de probabilidad. Una contradicción son dos resultados probables diferentes, no un engaño deliberado.</p>\n            <p><span class=\"label\">Di a tu clase</span></p>\n            <div class=\"quote\">\"Mentir requiere conocer la verdad y elegir decir algo diferente. La IA no sabe lo que dijo antes, y no 'sabe' nada como tú lo haces. La contradicción es un artefacto estadístico, no deshonestidad.\"</div>"
        },
        {
          "q": "¿Puedo hacer que la IA deje de contradecirse?",
          "a": "<p>Puedes reducir las contradicciones mediante el refinamiento de prompts: anclar la IA con restricciones explícitas, solicitar formato consistente, especificar el rol que debe desempeñar y pedirle que razone paso a paso antes de responder.</p>\n            <p><span class=\"label\">Di a tu clase</span></p>\n            <div class=\"quote\">\"Las contradicciones ocurren frecuentemente cuando un prompt es ambiguo. Cuanto más específicas sean tus restricciones, menos espacio hay para que la IA se mueva en múltiples direcciones.\"</div>"
        },
        {
          "q": "¿Importa si la IA se contradice en cosas pequeñas?",
          "a": "<p>Para uso casual, probablemente no. Pero en contextos de alto riesgo — un estudiante que depende de la IA para investigación, un médico que usa IA para verificar síntomas — las contradicciones pueden causar daño real.</p>\n            <p><span class=\"label\">Di a tu clase</span></p>\n            <div class=\"quote\">\"La IA diciéndote dos cosas diferentes sobre la altura de una celebridad: bien. La IA diciéndote dos cosas diferentes sobre interacciones de medicamentos: potencialmente peligroso.\"</div>"
        }
      ],
      "6": [
        {
          "q": "¿Es el sesgo de IA culpa de la IA?",
          "a": "<p>El sesgo de IA se origina principalmente en datos de entrenamiento creados y seleccionados por humanos. La IA refleja y frecuentemente amplifica los patrones ya presentes en sus datos de entrenamiento.</p>\n            <p><span class=\"label\">Di a tu clase</span></p>\n            <div class=\"quote\">\"Si enseñas a una IA solo con libros de historia que raramente presentan a mujeres en la ciencia, ¿qué predecirá la IA cuando le pidas que describa a un científico? La IA no decidió ser sesgada — pero los datos con los que aprendió lo eran.\"</div>"
        },
        {
          "q": "¿Podemos corregir el sesgo de IA?",
          "a": "<p>El sesgo puede reducirse mediante datos de entrenamiento más diversos, auditorías de sesgo, restricciones de equidad en el entrenamiento del modelo y equipos diversos que construyan los sistemas. Pero no puede eliminarse completamente porque todos los datos reflejan las decisiones y la historia humanas.</p>\n            <p><span class=\"label\">Di a tu clase</span></p>\n            <div class=\"quote\">\"El sesgo no es un error de una sola vez para corregir — es un desafío continuo a gestionar. La pregunta no es '¿tiene sesgo esta IA?' sino '¿cómo tiene sesgo, para quién, y qué estamos haciendo al respecto?'\"</div>"
        },
        {
          "q": "¿Estoy sesgado/a si clasifico currículums igual que la IA?",
          "a": "<p>Posiblemente — y ese es el punto. El sesgo no es un defecto de carácter; es un patrón que se forma a partir del entorno en el que creciste. Cuando el sesgo humano coincide con el sesgo de IA, a menudo es porque ambos aprendieron de los mismos patrones sociales.</p>\n            <p><span class=\"label\">Di a tu clase</span></p>\n            <div class=\"quote\">\"Si tus clasificaciones y las de la IA son sospechosamente similares, pregúntate: ¿usaste los mismos criterios? ¿A qué señales respondieron ambos? ¿Eran esas señales realmente relevantes para el desempeño laboral?\"</div>"
        }
      ],
      "7": [
        {
          "q": "¿Cómo sé si algo que me dijo la IA es una alucinación?",
          "a": "<p>A menudo no puedes saberlo del propio resultado de IA — las alucinaciones se presentan con el mismo estilo fluido y confiado que la información precisa. La forma de detectarlas es la verificación externa: comprueba la afirmación con una fuente confiable e independiente.</p>\n            <p><span class=\"label\">Di a tu clase</span></p>\n            <div class=\"quote\">\"La IA no te da una advertencia de 'esto me lo inventé'. Presenta las alucinaciones con la misma fuente, el mismo tono seguro, que la información correcta. Tu trabajo es ser el detective — verifica antes de repetir o actuar sobre ello.\"</div>"
        },
        {
          "q": "¿Qué hago si ya compartí algo que era una alucinación?",
          "a": "<p>Corrígelo lo antes posible, de manera clara y directa. La desinformación se propaga más rápido que las correcciones, así que la velocidad importa. Anota de dónde tomaste la afirmación, reconoce que fue generado por IA y no verificado, y comparte la información correcta con una cita de fuente confiable.</p>\n            <p><span class=\"label\">Di a tu clase</span></p>\n            <div class=\"quote\">\"El error no es usar IA — es compartir el resultado de IA sin verificación. Si ya lo compartiste, el movimiento responsable es una corrección clara: 'Compartí esto antes pero resulta que era inexacto — aquí está la información correcta.'\"</div>"
        },
        {
          "q": "¿Todas las herramientas de IA alucinan?",
          "a": "<p>Todos los modelos de lenguaje grande actuales tienen el potencial de alucinar — es inherente a cómo generan texto. Algunos modelos son más confiables que otros, y algunos dominios producen menos alucinaciones. Pero ninguno es inmune.</p>\n            <p><span class=\"label\">Di a tu clase</span></p>\n            <div class=\"quote\">\"No se trata de en qué IA confiar completamente — se trata de desarrollar hábitos: verificar afirmaciones de alto riesgo, usar la IA como punto de partida no como punto final, y nunca citar la IA como fuente primaria.\"</div>"
        }
      ],
      "8": [
        {
          "q": "¿Siempre tengo que usar los cinco elementos del marco?",
          "a": "<p>No — el marco Tarea/Contexto/Referencia/Formato/Tono es una herramienta de diagnóstico, no una lista de verificación. Las tareas simples pueden necesitar solo Tarea + Formato. El marco te ayuda a notar qué falta cuando un prompt falla.</p>\n            <p><span class=\"label\">Di a tu clase</span></p>\n            <div class=\"quote\">\"Piénsalo como una caja de herramientas, no como una receta. Cuando el resultado no es lo que querías, pregunta: ¿qué elemento me faltó? Luego añade ese elemento e inténtalo de nuevo.\"</div>"
        },
        {
          "q": "¿Cuál es la diferencia entre Contexto y Referencia?",
          "a": "<p>El Contexto es información de fondo sobre la situación (\"Soy un estudiante de 10° grado escribiendo un ensayo para clase de inglés\"). La Referencia es un ejemplo específico, plantilla o fuente que quieres que la IA tome como modelo. El Contexto establece el escenario; la Referencia da un modelo a seguir.</p>\n            <p><span class=\"label\">Di a tu clase</span></p>\n            <div class=\"quote\">\"Contexto: 'Estoy cocinando para alguien que no come lácteos.' Referencia: 'Aquí hay una receta que me encanta — adáptala para que no tenga lácteos.' Ambos son útiles, pero hacen trabajos diferentes.\"</div>"
        },
        {
          "q": "¿Por qué importa tanto el Tono?",
          "a": "<p>El tono moldea cómo el contenido llega a la audiencia. \"Escribe un argumento persuasivo\" y \"escribe un argumento persuasivo en tono amigable y conversacional para compañeros\" producen resultados muy diferentes.</p>\n            <p><span class=\"label\">Di a tu clase</span></p>\n            <div class=\"quote\">\"Hablarías diferente a tu mejor amigo, a un entrevistador universitario y a tu abuelo — incluso sobre el mismo tema. Decirle el tono a la IA es como decirle a quién le está hablando.\"</div>"
        }
      ],
      "9": [
        {
          "q": "Si la IA hace la mayor parte del trabajo, ¿sigue siendo mi proyecto?",
          "a": "<p>La autoría en la colaboración humano-IA es una pregunta real y no resuelta — pero el factor clave es la dirección, selección y juicio humanos. Si decidiste qué hacer, elegiste qué conservar, editaste lo que no encajaba y añadiste tu propia perspectiva, eres el autor.</p>\n            <p><span class=\"label\">Di a tu clase</span></p>\n            <div class=\"quote\">\"Un director de cine no opera la cámara, no actúa ni compone la música. Pero la película es suya. La co-creación significa que eres el director — la IA es parte de tu equipo.\"</div>"
        },
        {
          "q": "¿Qué es la descomposición y por qué importa para la IA?",
          "a": "<p>La descomposición significa dividir una tarea compleja en sub-tareas más pequeñas y manejables. Importa para la IA porque las solicitudes grandes y vagas producen resultados vagos. Cuando descompones, puedes asignar a cada sub-tarea un prompt específico.</p>\n            <p><span class=\"label\">Di a tu clase</span></p>\n            <div class=\"quote\">\"'Planifica toda mi campaña' es demasiado grande para que la IA lo haga bien. Pero 'dame 10 ideas de nombre para un club enfocado en acción ambiental' es lo suficientemente específico para obtener resultados útiles.\"</div>"
        },
        {
          "q": "¿Puede la IA generar ideas que sean realmente creativas?",
          "a": "<p>La IA puede generar combinaciones novedosas de patrones de sus datos de entrenamiento — lo que puede parecer creativo, y a veces produce ideas genuinamente sorprendentes. Pero la IA no tiene intenciones, experiencias ni apuestas en el resultado.</p>\n            <p><span class=\"label\">Di a tu clase</span></p>\n            <div class=\"quote\">\"La IA puede sugerir 50 nombres de campaña en 10 segundos. Algunos serán terribles, algunos sorprendentemente buenos. Tu trabajo es reconocer cuáles son cuáles — y ese juicio es un acto creativo que la IA no puede replicar.\"</div>"
        }
      ],
      "10": [
        {
          "q": "¿Remezclar el trabajo de alguien es lo mismo que copiarlo?",
          "a": "<p>No — remezclar implica transformar, combinar o construir sobre trabajo existente para crear algo nuevo. Copiar lo reproduce sin cambios. Las líneas legales y éticas se complican con la IA porque el modelo se entrenó con trabajo protegido por derechos de autor sin permiso explícito.</p>\n            <p><span class=\"label\">Di a tu clase</span></p>\n            <div class=\"quote\">\"Tomar una muestra de un ritmo y añadir nuevas letras es remezcla. Lanzar la canción de alguien más bajo tu nombre es copia. El trabajo generado por IA entrenado con el trabajo de artistas sin permiso está en un área legalmente gris que los tribunales aún están resolviendo.\"</div>"
        },
        {
          "q": "¿Puede el trabajo generado por IA ser verdaderamente original?",
          "a": "<p>Esto es genuinamente debatido entre filósofos, artistas y académicos legales. La IA recombina patrones de datos de entrenamiento — no parte de cero, no tiene experiencias ni toma decisiones intencionales. La mayoría de las definiciones de originalidad incluyen intencionalidad y expresión personal, que la IA carece.</p>\n            <p><span class=\"label\">Di a tu clase</span></p>\n            <div class=\"quote\">\"Si la originalidad requiere intención y experiencia personal, la IA no puede ser original — no tiene ninguna de las dos. Si originalidad simplemente significa 'no ha existido antes,' tal vez. ¿Qué crees TÚ que requiere la originalidad?\"</div>"
        },
        {
          "q": "Si edito el resultado de IA, ¿el trabajo final es original?",
          "a": "<p>Más que el resultado de IA sin editar. Las preguntas clave: ¿cuánto cambiaste? ¿Agregaste tu propia perspectiva, voz y juicio? ¿Requirió la edición decisiones creativas? Si la respuesta a esas preguntas es sí, el trabajo final tiene autoría humana significativa.</p>\n            <p><span class=\"label\">Di a tu clase</span></p>\n            <div class=\"quote\">\"Editar tres palabras en un ensayo de IA de 500 palabras no es lo mismo que reescribirlo para que suene como tú. El grado de contribución creativa humana importa.\"</div>"
        }
      ],
      "11": [
        {
          "q": "¿Quién es dueño del arte que crea la IA?",
          "a": "<p>Actualmente, en EE.UU., el derecho de autor requiere autoría humana — el trabajo puramente generado por IA sin contribución creativa humana puede no ser protegible. Las leyes están cambiando activamente y varían según el país.</p>\n            <p><span class=\"label\">Di a tu clase</span></p>\n            <div class=\"quote\">\"En 2023, la Oficina de Derechos de Autor de EE.UU. dictaminó que las imágenes generadas por IA sin contribución creativa humana no son protegibles por derechos de autor. Pero ¿qué cuenta como 'suficiente' contribución humana? Esa pregunta aún se está decidiendo en los tribunales.\"</div>"
        },
        {
          "q": "¿Es ético usar arte de IA si los artistas no consintieron el entrenamiento?",
          "a": "<p>Esto es genuinamente controvertido. Los artistas argumentan que entrenar con su trabajo sin consentimiento ni compensación es injusto y económicamente dañino. Las empresas de IA argumentan que entrenar con datos disponibles públicamente es como un artista humano aprendiendo de otros artistas.</p>\n            <p><span class=\"label\">Di a tu clase</span></p>\n            <div class=\"quote\">\"No hay respuesta fácil aquí. La pregunta no es solo legal — es sobre equidad, poder y lo que valoramos como sociedad. ¿Qué querrías si alguien entrenara una IA con tu trabajo creativo y vendiera los resultados?\"</div>"
        },
        {
          "q": "¿La atribución soluciona la ética de usar contenido generado por IA?",
          "a": "<p>La atribución es necesaria pero no siempre suficiente. Es honesta y es mejor que no atribuir — pero la atribución no compensa a los artistas por el daño económico, no aborda los problemas de consentimiento y no resuelve las preguntas de autoría.</p>\n            <p><span class=\"label\">Di a tu clase</span></p>\n            <div class=\"quote\">\"Si alguien usara tus fotos sin pedirte permiso y luego te acreditara, ¿se sentiría justo? La atribución importa — y a menudo hay más que considerar que solo eso.\"</div>"
        }
      ],
      "12": [
        {
          "q": "¿La IA se usa realmente en mi comunidad?",
          "a": "<p>Casi seguro que sí — a menudo de forma invisible. La IA impulsa la recomendación de contenido en redes sociales, las herramientas de selección de contratación usadas por empleadores locales, la puntuación de crédito en bancos y las ayudas de diagnóstico en hospitales cercanos.</p>\n            <p><span class=\"label\">Di a tu clase</span></p>\n            <div class=\"quote\">\"Piensa en la última vez que recibiste una recomendación — Netflix, Spotify, Amazon, tu feed de Instagram. Todo IA. Piensa en admisiones universitarias, solicitudes de trabajo, aprobaciones de préstamos en tu área. La IA probablemente está involucrada.\"</div>"
        },
        {
          "q": "¿A quién le dirijo mi llamado a la acción?",
          "a": "<p>Identifica al tomador de decisiones específico que tiene el poder de hacer el cambio que pides. Para uso de IA en escuelas: un director o consejo escolar. Para IA gubernamental local: un miembro del consejo municipal. Para el producto de IA de una empresa: su equipo de política pública.</p>\n            <p><span class=\"label\">Di a tu clase</span></p>\n            <div class=\"quote\">\"'La sociedad debería corregir el sesgo de IA' no es un llamado a la acción — es un deseo. 'El consejo escolar debería requerir una auditoría anual de sesgo de cualquier herramienta de IA usada en admisiones' es un llamado a la acción.\"</div>"
        },
        {
          "q": "¿Puede una persona realmente cambiar cómo se usa la IA?",
          "a": "<p>Los cambios de política, las leyes de responsabilidad algorítmica y las decisiones corporativas sobre IA han sido influenciadas por defensores individuales, campañas estudiantiles y organización comunitaria.</p>\n            <p><span class=\"label\">Di a tu clase</span></p>\n            <div class=\"quote\">\"Los legisladores que redactaron la Ley de IA de la UE eran personas individuales con convicciones individuales que trabajaron con otros. Los artistas que presentaron demandas contra empresas de IA eran individuos. No tienes que cambiar el mundo solo — pero tienes que empezar en algún lugar.\"</div>"
        }
      ],
      "13": [
        {
          "q": "¿Cuánto de este proyecto debería ser IA vs. yo?",
          "a": "<p>La rúbrica prioriza el razonamiento humano, la reflexión ética y la voz del estudiante. La IA debe ser un colaborador documentado — usado para investigación, generar opciones y redactar. Pero cada predicción, cada argumento ético y cada reflexión personal deben ser genuinamente tuyos.</p>\n            <p><span class=\"label\">Di a tu clase</span></p>\n            <div class=\"quote\">\"Tu registro de colaboración debe mostrar que la IA te ayudó — pero tu presentación debe mostrar que tú pensaste. El trabajo de la IA es darte más con qué trabajar. Tu trabajo es darle sentido, evaluarlo y añadir lo que solo tú puedes añadir.\"</div>"
        },
        {
          "q": "¿Qué pasa si mi predicción resulta incorrecta?",
          "a": "<p>Está bien — las predicciones sobre sistemas complejos raramente son perfectamente precisas, y eso no es lo que evalúa este proyecto. La rúbrica recompensa la calidad del razonamiento, no la corrección de la predicción.</p>\n            <p><span class=\"label\">Di a tu clase</span></p>\n            <div class=\"quote\">\"No te van a calificar por si predijiste el futuro correctamente. Te van a calificar por qué tan cuidadosamente razonaste, qué tan honestamente te comprometiste con la ética, y qué tan claramente explicaste tu proceso.\"</div>"
        },
        {
          "q": "¿Tengo que usar IA en este proyecto?",
          "a": "<p>El proyecto está diseñado específicamente para involucrar la colaboración con IA — eso es lo que lo convierte en una evaluación sumativa para esta unidad. Usar IA no es opcional, pero cómo la usas y qué haces con ella depende de ti.</p>\n            <p><span class=\"label\">Di a tu clase</span></p>\n            <div class=\"quote\">\"Este proyecto trata de mostrar lo que aprendiste sobre trabajar con IA. No puedes mostrar eso sin realmente trabajar con IA. Pero tú estás a cargo del proyecto — la IA es tu herramienta, no tu jefe.\"</div>"
        }
      ]
    },

/* COURSES holds content for courses 2-4; course 1 ("how-ai-makes-decisions")
   is served directly from CONTENT[lang] for backward-compatibility.
   HAW_CONTENT / FGAI_CONTENT / PSAI_CONTENT are declared below in this script;
   we wire them up here so COURSES is always up-to-date. */
const COURSES = {
  "how-ai-works": typeof HAW_CONTENT !== "undefined" ? HAW_CONTENT : null,
  "foundations-of-generative-ai": typeof FGAI_CONTENT !== "undefined" ? FGAI_CONTENT : null,
  "problem-solving-with-ai": typeof PSAI_CONTENT !== "undefined" ? PSAI_CONTENT : null,
};

/* ============================================================
   CONVERSATION ENGINE
   ============================================================ */
const STATE = {
  lang: localStorage.getItem("teacherAssistantLang") || "en",
  courseId: localStorage.getItem("teacherAssistantCourse") || null,
  tab: "chat",
  chat: [],
  context: null, // {intent, lessonId, ...}
  lastLessonTaught: localStorage.getItem("lastLessonTaught") || null,
  pendingNote: null, // reflection notes from last lesson
  generation: 0, // increments on reset/lang-switch; pending async calls check this
};

/* Render helpers */
function $(id) { return document.getElementById(id); }

/** Returns merged language + course-specific content.
 *  For "how-ai-makes-decisions", CONTENT[lang] already has everything.
 *  For other courses, course-specific keys (greetings, preflight, etc.)
 *  are overlaid from COURSES[courseId][lang]. */
function t() {
  const lang = CONTENT[STATE.lang];
  const cid = STATE.courseId || "how-ai-makes-decisions";
  if (cid === "how-ai-makes-decisions" || !COURSES[cid] || !COURSES[cid][STATE.lang]) {
    return lang;
  }
  return { ...lang, ...COURSES[cid][STATE.lang] };
}

function nowTime() {
  const d = new Date();
  let h = d.getHours();
  const m = String(d.getMinutes()).padStart(2, "0");
  const ampm = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  return `${h}:${m} ${ampm}`;
}

function renderHeader() {
  // Show current course name if one is selected; otherwise show generic app name
  const meta = STATE.courseId
    ? (COURSE_META[STATE.lang] || COURSE_META.en).find(m => m.id === STATE.courseId)
    : null;
  $("hdr-name").textContent = meta ? meta.name : t().ui.appName;
  $("hdr-status").textContent = meta ? meta.grade : t().ui.online;
  $("tab-chat").textContent = t().ui.tabChat;
  $("tab-onboarding").textContent = t().ui.tabOnboarding;
  $("input-text").placeholder = t().ui.placeholder;
  $("reset-btn").title = t().ui.resetTitle;
  document.documentElement.lang = STATE.lang === "hi" ? "hi" : STATE.lang;
}

function appendDayDivider() {
  const div = document.createElement("div");
  div.className = "day-divider";
  div.innerHTML = `<span>${new Date().toLocaleDateString(STATE.lang === "hi" ? "hi-IN" : STATE.lang === "es" ? "es-ES" : "en-US", { weekday: "long", month: "short", day: "numeric" })}</span>`;
  $("chat").appendChild(div);
}

function appendSystem(text) {
  const div = document.createElement("div");
  div.className = "system-msg";
  div.innerHTML = `<span>${text}</span>`;
  $("chat").appendChild(div);
  scrollChat();
}

function appendBubble(side, html) {
  const row = document.createElement("div");
  row.className = `msg-row ${side}`;
  const bubble = document.createElement("div");
  bubble.className = `bubble ${side}`;
  const tickHtml = side === "out" ? `<span class="ticks">✓✓</span>` : '';
  bubble.innerHTML = `<div class="text">${html}</div><div class="meta">${nowTime()} ${tickHtml}</div>`;
  row.appendChild(bubble);
  $("chat").appendChild(row);
  scrollChat();
}

function showTyping() {
  const row = document.createElement("div");
  row.className = "msg-row in";
  row.id = "typing-row";
  row.innerHTML = `<div class="typing-bubble"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>`;
  $("chat").appendChild(row);
  $("hdr-status").textContent = t().ui.typing;
  scrollChat();
}

function hideTyping() {
  const row = document.getElementById("typing-row");
  if (row) row.remove();
  $("hdr-status").textContent = t().ui.online;
}

function scrollChat() {
  const c = $("chat");
  c.scrollTop = c.scrollHeight;
}

function clearQuickReplies() {
  $("quick-replies").innerHTML = "";
}

function setQuickReplies(replies) {
  const qr = $("quick-replies");
  qr.innerHTML = "";
  replies.forEach(r => {
    const btn = document.createElement("button");
    btn.className = `qr-chip${r.primary ? " primary" : ""}${r.secondary ? " secondary" : ""}`;
    btn.textContent = r.label;
    btn.addEventListener("click", () => {
      // Echo the user's choice as a sent message
      appendBubble("out", escapeHtml(r.label));
      clearQuickReplies();
      r.action();
    });
    qr.appendChild(btn);
  });
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

/* Bot says: append with typing delay. Generation token prevents stale messages
   from a previous language/reset from appearing in the new conversation. */
async function botSay(html, delay = 700) {
  const gen = STATE.generation;
  showTyping();
  await wait(delay);
  if (STATE.generation !== gen) return; // Stale call — abort
  hideTyping();
  appendBubble("in", html);
}

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }
